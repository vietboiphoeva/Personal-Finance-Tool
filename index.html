<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Every Second Counts</title>
  <!-- Google Fonts for Retro LED & Industrial Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0a0a0a;
      font-family: 'Share Tech Mono', monospace;
      color: #ff3333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .header {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
      color: #666666;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .container {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 680px;
    }
    .card {
      flex: 1;
      background: #121212;
      border: 2px solid #222222;
      border-radius: 6px;
      padding: 10px 14px;
      text-align: center;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9), 0 2px 8px rgba(0,0,0,0.6);
    }
    .label {
      font-size: 36px;
      letter-spacing: 1.5px;
      color: #777777;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .timer {
      font-family: 'VT323', monospace;
      font-size: 36px;
      line-height: 1.1;
      color: #ff2222;
      /* Red Neon Glow Effect */
      text-shadow: 0 0 6px rgba(255, 34, 34, 0.7), 0 0 14px rgba(255, 34, 34, 0.4);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      margin: 2px 0;
    }
    .meta {
      font-size: 36px;
      color: #555555;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="header">EVERY SECOND COUNTS</div>
  <div class="container">
    <div class="card">
      <div class="label">Lifestyle Runway</div>
      <div id="lifestyle-clock" class="timer">000d 00:00:00</div>
      <div class="meta">At $2,950/mo &bull; Mar 17, 2027</div>
    </div>
    <div class="card">
      <div class="label">Survival Runway</div>
      <div id="survival-clock" class="timer">000d 00:00:00</div>
      <div class="meta">At $1,215/mo &bull; Feb 05, 2028</div>
    </div>
  </div>

  <script>
    const lifestyleEnd = new Date("2027-03-17T00:00:00").getTime();
    const survivalEnd  = new Date("2028-02-05T00:00:00").getTime();

    function updateClocks() {
      const now = new Date().getTime();
      function formatDiff(target) {
        const diff = Math.max(0, target - now);
        const d = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(3, '0');
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        const s = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        return `${d}d ${h}:${m}:${s}`;
      }
      document.getElementById("lifestyle-clock").innerText = formatDiff(lifestyleEnd);
      document.getElementById("survival-clock").innerText  = formatDiff(survivalEnd);
    }
    setInterval(updateClocks, 1000);
    updateClocks();
  </script>
</body>
</html>
